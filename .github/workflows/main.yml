name: Build VideoStarTool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q -K master.zip
          mv sdks-master/*.sdk $HOME/theos/sdks/ || true

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Extract dylib and upload artifacts
        run: |
          mkdir -p output
          cp packages/*.deb output/
          cp .theos/obj/debug/ZZZZZZVideoStarTool.dylib output/ 2>/dev/null || cp .theos/obj/ZZZZZZVideoStarTool.dylib output/
          cp ZZZZZZVideoStarTool.plist output/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-Build
          path: output/
